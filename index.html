<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>شماره کارت - نیما میهمی</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
--bg: #0d0f0e;
--bg-2: #151816;
--card-1: #1c2420;
--card-2: #2a362f;
--gold: #c9a24b;
--gold-soft: #e8cf8a;
--text: #f3f1ea;
--text-dim: #9aa29c;
--ok: #7fbf8f;
color-scheme: dark;
box-sizing: border-box;
padding-top: env(safe-area-inset-top, 0px);
padding-bottom: env(safe-area-inset-bottom, 0px);
}
* { box-sizing: inherit; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
html, body {
height: 100%;
margin: 0;
}
body {
background: radial-gradient(1200px 600px at 50% -10%, #1a221d 0%, var(--bg) 60%);
color: var(--text);
font-family: 'Vazirmatn', Tahoma, sans-serif;
display: flex;
align-items: center;
justify-content: center;
padding: 24px;
}

.wrap {
width: 100%;
max-width: 420px;
display: flex;
flex-direction: column;
align-items: center;
gap: 28px;
}

.card {
width: 100%;
aspect-ratio: 1.586 / 1;
border-radius: 20px;
background:
linear-gradient(135deg, var(--card-2) 0%, var(--card-1) 55%, #10140f 100%);
border: 1px solid rgba(201, 162, 75, 0.25);
box-shadow: 0 20px 50px -20px rgba(0,0,0,0.7), inset 0 1px 0 rgba(255,255,255,0.04);
padding: 22px 26px;
display: flex;
flex-direction: column;
justify-content: space-between;
position: relative;
overflow: hidden;
}

.card::before {
content: "";
position: absolute;
inset: 0;
background: repeating-linear-gradient(
115deg,
transparent 0 18px,
rgba(255,255,255,0.015) 18px 19px
);
pointer-events: none;
}

.chip {
width: 42px;
height: 32px;
border-radius: 6px;
background: linear-gradient(145deg, var(--gold-soft), var(--gold) 60%, #8a6c2f);
position: relative;
}
.chip::after {
content: "";
position: absolute;
inset: 5px;
border: 1px solid rgba(0,0,0,0.25);
border-radius: 3px;
}

.top-row {
display: flex;
justify-content: space-between;
align-items: flex-start;
}

.mark {
font-size: 12px;
letter-spacing: 0.04em;
color: var(--text-dim);
}

.number {
font-variant-numeric: tabular-nums;
direction: ltr;
text-align: right;
font-size: clamp(19px, 5.6vw, 24px);
letter-spacing: 0.04em;
color: var(--text);
font-weight: 500;
}

.bottom-row {
display: flex;
justify-content: space-between;
align-items: flex-end;
}

.holder {
font-size: 15px;
font-weight: 600;
color: var(--text);
}

.holder-label {
font-size: 11px;
color: var(--text-dim);
margin-bottom: 4px;
}

button.copy-btn {
appearance: none;
border: none;
width: 100%;
padding: 15px 20px;
border-radius: 14px;
background: var(--gold);
color: #141712;
font-family: inherit;
font-size: 16px;
font-weight: 600;
cursor: pointer;
display: flex;
align-items: center;
justify-content: center;
gap: 10px;
transition: transform 0.15s ease, background 0.2s ease;
}
button.copy-btn:active {
transform: scale(0.97);
}
button.copy-btn.done {
background: var(--ok);
color: #0d140f;
}

.hint {
color: var(--text-dim);
font-size: 13px;
text-align: center;
}

svg { width: 18px; height: 18px; flex-shrink: 0; }

.bg {
position: fixed;
inset: 0;
z-index: 0;
pointer-events: none;
background: radial-gradient(900px 500px at 50% 0%, rgba(76,175,98,0.10), transparent 70%);
}
.bg svg { width: 100%; height: 100%; display: block; }
.bg::after {
content: "";
position: absolute;
inset: 0;
background: radial-gradient(ellipse at center, transparent 35%, rgba(13,15,14,0.75) 100%);
}
.wrap { position: relative; z-index: 1; }
</style>
</head>
<body>

<div class="bg" aria-hidden="true">
<svg xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
<defs>
<path id="lf" d="M0 0C7 -18 8 -46 0 -78C-8 -46 -7 -18 0 0Z"/>
<g id="leaf">
<use href="#lf"/>
<use href="#lf" transform="rotate(-32) scale(.88)"/>
<use href="#lf" transform="rotate(32) scale(.88)"/>
<use href="#lf" transform="rotate(-62) scale(.68)"/>
<use href="#lf" transform="rotate(62) scale(.68)"/>
<use href="#lf" transform="rotate(-92) scale(.42)"/>
<use href="#lf" transform="rotate(92) scale(.42)"/>
<rect x="-1.3" y="0" width="2.6" height="28" rx="1.3"/>
</g>
<pattern id="p" width="170" height="170" patternUnits="userSpaceOnUse">
<g fill="#4caf62" fill-opacity="0.16">
<use href="#leaf" transform="translate(52 112) rotate(-18) scale(.9)"/>
<use href="#leaf" transform="translate(126 62) rotate(24) scale(.6)"/>
</g>
</pattern>
</defs>
<rect width="100%" height="100%" fill="url(#p)"/>
</svg>
</div>

<div class="wrap">
<div class="card">
<div class="top-row">
<div class="chip"></div>
<div class="mark">کارت بانکی</div>
</div>
<div class="number" id="cardNumber">6063 7311 6581 4048</div>
<div class="bottom-row">
<div>
<div class="holder-label">صاحب کارت</div>
<div class="holder">نیما میهمی</div>
</div>
</div>
</div>

<button class="copy-btn" id="copyBtn">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
<span id="btnLabel">کپی شماره کارت</span>
</button>

<div class="hint" id="hintText">با یک لمس روی تگ، این صفحه باز می‌شود</div>
</div>

<script>
const digits = "6063731165814048";
const btn = document.getElementById('copyBtn');
const label = document.getElementById('btnLabel');
const hint = document.getElementById('hintText');

btn.addEventListener('click', async () => {
try {
await navigator.clipboard.writeText(digits);
showDone();
} catch (err) {
try {
const ta = document.createElement('textarea');
ta.value = digits;
ta.style.position = 'fixed';
ta.style.opacity = '0';
document.body.appendChild(ta);
ta.select();
document.execCommand('copy');
document.body.removeChild(ta);
showDone();
} catch (e2) {
hint.textContent = 'کپی خودکار کار نکرد؛ شماره را دستی انتخاب کنید';
}
}
});

function showDone() {
btn.classList.add('done');
label.textContent = 'کپی شد ✓';
setTimeout(() => {
btn.classList.remove('done');
label.textContent = 'کپی شماره کارت';
}, 1800);
}
</script>

</body>
</html>
